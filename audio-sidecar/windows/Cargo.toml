[package]
name = "docprep-audio"
version = "0.2.0"
edition = "2021"
description = "Windows native offline audio/video transcription & speaker diarization sidecar for AI DocPrep"

[[bin]]
name = "docprep-audio"
path = "src/main.rs"

[dependencies]
# whisper.cpp in-process. The `vulkan` feature builds the ggml Vulkan backend
# (vendor-agnostic GPU: NVIDIA, AMD, Intel, Qualcomm); CPU fallback is automatic.
whisper-rs = { version = "0.16", features = ["vulkan"] }
# sherpa-onnx in-process: Parakeet TDT transducer + pyannote/CAM++ speaker
# diarization. `download-binaries` fetches the matching prebuilt sherpa-onnx
# runtime at BUILD time; at run time the DLLs ship beside the exe.
sherpa-rs = { version = "0.6", features = ["download-binaries", "sys"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
